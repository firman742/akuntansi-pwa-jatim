# This is an example configuration file
# To learn more, see the full config.yaml reference: https://docs.continue.dev/reference

name: Example Config
version: 1.0.0
schema: v1

# Define which models can be used
# https://docs.continue.dev/customization/models
models:
  - title: Ollama
    provider: ollama
    model: AUTODETECT
    apiBase: http://localhost:11434

  - title: Groq
    provider: groq
    model: AUTODETECT
    apiKey: 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

customCommands:
  - name: test
    description: Write unit tests for highlighted code
    prompt: |
      {{{ input }}}

      Write a comprehensive set of unit tests for the selected code. It should setup, run tests that check for correctness including important edge cases, and teardown. Ensure that the tests are complete and sophisticated. Give the tests just as chat output, don't edit any file.

tabAutocompleteModel:
  title: codeqwen
  provider: ollama
  model: starcoder2:3b

contextProviders:
  - name: code
  - name: docs
  - name: diff
  - name: terminal
  - name: problems
  - name: folder
  - name: codebase

slashCommands:
  - name: edit
    description: Edit selected code
  - name: comment
    description: Write comments for the selected code
  - name: share
    description: Export the current chat session to markdown
  - name: cmd
    description: Generate a shell command
  - name: commit
    description: Generate a git commit message